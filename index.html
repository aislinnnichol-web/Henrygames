<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Key Quest: Rise of the God</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #111;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }
    #gameWrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 800px;
    }
    canvas {
      border: 3px solid #444;
      border-radius: 8px;
      image-rendering: pixelated;
      cursor: default;
      width: 100%;
      max-width: 800px;
      height: auto;
    }
    #hud {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }
    .hud-panel {
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #controls {
      color: #888;
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
    }
    #controls span { color: #bbb; font-weight: bold; }

    /* ── Touch Controls ── */
    #touchControls {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 200px;
      z-index: 100;
      pointer-events: none;
    }
    .touch-area {
      pointer-events: auto;
    }
    /* D-Pad */
    #dpad {
      position: absolute;
      left: 20px;
      bottom: 20px;
      width: 150px;
      height: 150px;
    }
    .dpad-btn {
      position: absolute;
      width: 50px;
      height: 50px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.7);
      font-size: 22px;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }
    .dpad-btn:active, .dpad-btn.active {
      background: rgba(255,255,255,0.35);
    }
    #dpad-up    { left: 50px; top: 0; }
    #dpad-down  { left: 50px; bottom: 0; }
    #dpad-left  { left: 0; top: 50px; }
    #dpad-right { right: 0; top: 50px; }
    /* Action Buttons */
    #actionBtns {
      position: absolute;
      right: 20px;
      bottom: 20px;
      width: 150px;
      height: 150px;
    }
    .action-btn {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
      border: 2px solid;
    }
    .action-btn:active, .action-btn.active {
      filter: brightness(1.5);
    }
    #btn-a {
      background: rgba(76, 175, 80, 0.3);
      border-color: rgba(76, 175, 80, 0.6);
      right: 0;
      top: 45px;
    }
    #btn-b {
      background: rgba(244, 67, 54, 0.3);
      border-color: rgba(244, 67, 54, 0.6);
      right: 70px;
      top: 80px;
    }
    /* Move buttons for combat */
    #moveBtns {
      position: absolute;
      bottom: 180px;
      left: 10px;
      right: 10px;
      display: none;
      gap: 8px;
      pointer-events: auto;
    }
    .move-btn {
      flex: 1;
      padding: 12px 4px;
      background: rgba(0,0,0,0.7);
      border: 2px solid #555;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      text-align: center;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }
    .move-btn.selected {
      border-color: #FFD700;
      background: rgba(255,215,0,0.15);
    }

    /* Mobile responsive */
    @media (max-width: 820px) {
      #controls { display: none; }
      #touchControls { display: block; }
      canvas {
        border-width: 2px;
        border-radius: 4px;
      }
      .hud-panel { font-size: 10px; padding: 4px 8px; }
    }
    @media (hover: none) and (pointer: coarse) {
      #controls { display: none; }
      #touchControls { display: block; }
    }
  </style>
</head>
<body>
  <div id="gameWrapper">
    <canvas id="game" width="800" height="600"></canvas>
    <div id="hud">
      <div class="hud-panel" id="hudLeft"></div>
      <div class="hud-panel" id="hudRight"></div>
    </div>
    <div id="controls">
      <span>WASD / Arrows</span> Move &nbsp;|&nbsp;
      <span>Space</span> Interact / Attack &nbsp;|&nbsp;
      <span>1-4</span> Select Move &nbsp;|&nbsp;
      <span>Enter</span> Confirm
    </div>
  </div>

  <!-- Touch Controls -->
  <div id="touchControls">
    <!-- D-Pad -->
    <div id="dpad" class="touch-area">
      <div class="dpad-btn" id="dpad-up" data-dir="up">&#9650;</div>
      <div class="dpad-btn" id="dpad-down" data-dir="down">&#9660;</div>
      <div class="dpad-btn" id="dpad-left" data-dir="left">&#9664;</div>
      <div class="dpad-btn" id="dpad-right" data-dir="right">&#9654;</div>
    </div>
    <!-- A / B Buttons -->
    <div id="actionBtns" class="touch-area">
      <div class="action-btn" id="btn-a">A</div>
      <div class="action-btn" id="btn-b">B</div>
    </div>
    <!-- Combat move buttons (shown only in combat) -->
    <div id="moveBtns"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
