<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key Quest: Rise of the God</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    #gameWrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      border: 3px solid #444;
      border-radius: 8px;
      image-rendering: pixelated;
      cursor: default;
    }
    #hud {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }
    .hud-panel {
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #controls {
      color: #888;
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
    }
    #controls span { color: #bbb; font-weight: bold; }
  </style>
</head>
<body>
  <div id="gameWrapper">
    <canvas id="game" width="800" height="600"></canvas>
    <div id="hud">
      <div class="hud-panel" id="hudLeft"></div>
      <div class="hud-panel" id="hudRight"></div>
    </div>
    <div id="controls">
      <span>WASD / Arrows</span> Move &nbsp;|&nbsp;
      <span>Space</span> Interact / Attack &nbsp;|&nbsp;
      <span>1-4</span> Select Move &nbsp;|&nbsp;
      <span>Enter</span> Confirm
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
